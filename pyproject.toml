[project]
name = "famous-paintings-classification"
version = "0.1.0"
description = "Classify a painting among 25 famous painters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[tool.uv]
package = false
